create:
  name: Create notification
  description: Add a feed item with no automatic expiry, or replace one with the same key.
  fields: &create_fields
    topic:
      name: Topic
      required: true
      selector:
        select:
          mode: dropdown
          options: []
    message:
      name: Message
      required: true
      selector:
        text:
    key:
      name: Key
      selector:
        text:
    title:
      name: Title
      selector:
        text:
    icon:
      name: Icon
      selector:
        icon:
    severity:
      name: Severity
      required: true
      default: info
      selector:
        select:
          mode: dropdown
          options:
            - label: Info
              value: info
            - label: Success
              value: success
            - label: Warning
              value: warning
            - label: Error
              value: error
    persistent:
      name: Persistent
      description: Cannot be dismissed from a dashboard card.
      required: true
      default: false
      selector:
        boolean:

create_timed:
  name: Create timed notification
  description: Add a feed item that expires after a duration.
  fields:
    <<: *create_fields
    expires_in:
      name: Expires in
      description: Duration before this notification is removed.
      required: true
      selector:
        duration:

create_scheduled_expiry:
  name: Create scheduled expiry notification
  description: Add a feed item that expires at a date and time.
  fields:
    <<: *create_fields
    expires_at:
      name: Expires at
      description: Date and time at which this notification is removed.
      required: true
      selector:
        datetime:
dismiss:
  name: Dismiss notification
  description: Dismiss an item by its integration ID or replacement key.
  fields:
    id:
      selector:
        text:
    key:
      selector:
        text:
